<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — tapllul</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{--bg:#fff;--fg:#14161a;--muted:#5c6470;--accent:#2f5bff}

  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);

  p{color:var(--muted);margin:0 0 26px}
  a{color:var(--accent);text-decoration:none;font-weight:600;border:1px solid currentColor;
    padding:10px 18px;border-radius:10px;display:inline-block}

</style>
</head>
<body>
